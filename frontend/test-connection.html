<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <meta name="theme-color" content="#714B67">
    <title>Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        h1 { color: #333; }
    </style>
</head>
<body>
    <h1>🔌 Connection Test Page</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type) {
            const div = document.createElement('div');
            div.className = 'test-result ' + type;
            div.textContent = message;
            results.appendChild(div);
        }

        addResult('✅ Page loaded successfully', 'success');
        addResult('✅ JavaScript is executing', 'success');

        fetch('enhanced-dashboard.html')
            .then(response => {
                if (response.ok) {
                    addResult('✅ enhanced-dashboard.html is accessible', 'success');
                } else {
                    addResult('❌ enhanced-dashboard.html returned status: ' + response.status, 'error');
                }
            })
            .catch(error => {
                addResult('❌ Error fetching enhanced-dashboard.html: ' + error, 'error');
            });

        fetch('css/dashboard.css')
            .then(response => {
                if (response.ok) {
                    addResult('✅ css/dashboard.css is accessible', 'success');
                } else {
                    addResult('❌ css/dashboard.css returned status: ' + response.status, 'error');
                }
            })
            .catch(error => {
                addResult('❌ Error fetching css/dashboard.css: ' + error, 'error');
            });
    </script>
</body>
</html>
