<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Status — Azolve</title>
<link rel="icon" href="assets/favicon-32.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #714B67 0%, #00A09D 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,.25);
  }
  .icon-circle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    margin: 0 auto 24px;
  }
  .icon-circle.success { background: linear-gradient(135deg, #00b894, #00A09D); }
  .icon-circle.failed  { background: linear-gradient(135deg, #e17055, #d63031); }
  .icon-circle.verifying { background: linear-gradient(135deg, #714B67, #00A09D); }
  h1 { font-size: 26px; font-weight: 900; margin-bottom: 10px; color: #1a1a2e; }
  .subtitle { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 28px; }
  .plan-badge {
    display: inline-block;
    background: linear-gradient(135deg, #714B67, #00A09D);
    color: #fff;
    padding: 8px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .detail-box {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
    text-align: left;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid #eee;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: #666; }
  .detail-value { font-weight: 600; color: #1a1a2e; }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    text-decoration: none;
    transition: all .2s;
    width: 100%;
    margin-bottom: 10px;
  }
  .btn-primary { background: linear-gradient(135deg, #714B67, #00A09D); color: #fff; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .btn-outline { background: none; border: 1.5px solid #ddd; color: #666; }
  .btn-outline:hover { border-color: #00A09D; color: #00A09D; }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-bar-wrap { background: #eee; border-radius: 10px; height: 6px; margin-bottom: 20px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #714B67, #00A09D); border-radius: 10px; transition: width .5s ease; }
  .cashfree-badge { margin-top: 20px; font-size: 11px; color: #aaa; }
  .error-details { background: #fff3f3; border: 1px solid #f5c6cb; border-radius: 8px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #721c24; }
</style>
</head>
<body>

<div class="card" id="statusCard">
  <div class="icon-circle verifying">
    <div class="spinner"></div>
  </div>
  <h1>Verifying Payment</h1>
  <p class="subtitle">Please wait while we confirm your payment with the gateway...</p>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar" style="width:20%"></div>
  </div>
  <div style="font-size:13px;color:#999;">Do not close or refresh this page</div>
</div>

<script>
const API_BASE = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:3000/api' : 'https://azolve-api.onrender.com/api';

const PLAN_NAMES = {
  free: 'Free',
  starter: 'Starter',
  professional: 'Professional',
  enterprise: 'Enterprise',
  pos_addon: 'POS Add-on',
};

const PLAN_ICONS = {
  free: '🆓',
  starter: '🚀',
  professional: '⭐',
  enterprise: '👑',
  pos_addon: '🏪',
};

// Fetch with retry for Render cold-start resilience
async function fetchWithRetry(url, options, maxRetries = 2) {
  let lastError;
  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);
      const resp = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(timeoutId);
      return resp;
    } catch (err) {
      lastError = err;
      if (attempt < maxRetries) {
        await new Promise(r => setTimeout(r, 3000));
        continue;
      }
    }
  }
  throw lastError;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order_id');
  const plan = params.get('plan');
  const cycle = params.get('cycle') || 'monthly';

  // Animate progress bar
  let progress = 20;
  const progressInterval = setInterval(() => {
    progress = Math.min(progress + 10, 85);
    const bar = document.getElementById('progressBar');
    if (bar) bar.style.width = progress + '%';
  }, 400);

  if (!orderId) {
    clearInterval(progressInterval);
    showFailed('No order ID found. Please contact support.', null, plan, cycle);
    return;
  }

  const token = localStorage.getItem('authToken');
  if (!token) {
    clearInterval(progressInterval);
    window.location.href = 'login.html';
    return;
  }

  // Wait 2 seconds for Cashfree to process, then verify
  await new Promise(r => setTimeout(r, 2000));

  try {
    const resp = await fetchWithRetry(`${API_BASE}/payments/verify`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      },
      body: JSON.stringify({ orderId }),
    }, 2);

    clearInterval(progressInterval);
    const bar = document.getElementById('progressBar');
    if (bar) bar.style.width = '100%';

    const data = await resp.json();

    await new Promise(r => setTimeout(r, 500));

    if (data.success) {
      const company = JSON.parse(localStorage.getItem('azolve_company') || '{}');
      if (data.data) {
        company.plan = data.data.plan;
        company.planExpiry = data.data.planExpiry;
        company.features = data.data.features;
        company.hasPOS = data.data.features?.hasPOS;
        localStorage.setItem('azolve_company', JSON.stringify(company));
      }
      localStorage.removeItem('azv_pending_order');
      showSuccess(plan, cycle, orderId, data.data);
    } else {
      showFailed(data.message || 'Payment verification failed.', orderId, plan, cycle);
    }
  } catch (e) {
    clearInterval(progressInterval);
    console.error('Verification error:', e);
    showFailed('Network error during verification. Your payment may still have succeeded — please check your plan status in the dashboard.', orderId, plan, cycle);
  }
}

function showSuccess(plan, cycle, orderId, planData) {
  const planName = PLAN_NAMES[plan] || plan;
  const planIcon = PLAN_ICONS[plan] || '✅';
  const expiry = planData?.planExpiry ? new Date(planData.planExpiry).toLocaleDateString('en-IN', {
    day: 'numeric', month: 'long', year: 'numeric'
  }) : 'N/A';

  document.getElementById('statusCard').innerHTML = `
    <div class="icon-circle success">✅</div>
    <h1>Payment Successful!</h1>
    <p class="subtitle">Your plan has been activated. Welcome to <strong>${planName}</strong>!</p>
    <div class="plan-badge">${planIcon} ${planName} ${cycle === 'yearly' ? '(Annual)' : '(Monthly)'}</div>
    <div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">Plan Activated</span>
        <span class="detail-value">${planIcon} ${planName}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Billing Cycle</span>
        <span class="detail-value">${cycle === 'yearly' ? 'Annual' : 'Monthly'}</span>
      </div>
      ${expiry !== 'N/A' ? `<div class="detail-row">
        <span class="detail-label">Valid Until</span>
        <span class="detail-value">${expiry}</span>
      </div>` : ''}
      <div class="detail-row">
        <span class="detail-label">Order ID</span>
        <span class="detail-value" style="font-size:11px;font-family:monospace;">${orderId}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Status</span>
        <span class="detail-value" style="color:#00b894;">✅ Paid</span>
      </div>
    </div>
    ${plan === 'pos_addon' || plan === 'enterprise' ? `
    <div style="background:#d4edda;border:1px solid #c3e6cb;border-radius:8px;padding:12px;margin-bottom:20px;font-size:13px;color:#155724;">
      🏪 <strong>POS Terminal Unlocked!</strong> You can now access the POS Terminal from your dashboard.
    </div>` : ''}
    <button class="btn btn-primary" onclick="goToDashboard()">🚀 Go to Dashboard</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ Print Receipt</button>
    <div class="cashfree-badge">Payment processed securely by Cashfree Payments</div>
  `;
}

function showFailed(message, orderId, plan, cycle) {
  document.getElementById('statusCard').innerHTML = `
    <div class="icon-circle failed">❌</div>
    <h1>Payment Failed</h1>
    <p class="subtitle">We couldn't process your payment. No amount has been deducted.</p>
    ${message ? `<div class="error-details">⚠️ ${message}</div>` : ''}
    ${orderId ? `<div class="detail-box">
      <div class="detail-row">
        <span class="detail-label">Order ID</span>
        <span class="detail-value" style="font-size:11px;font-family:monospace;">${orderId}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Plan</span>
        <span class="detail-value">${PLAN_NAMES[plan] || plan || 'N/A'}</span>
      </div>
    </div>` : ''}
    <button class="btn btn-primary" onclick="retryPayment('${plan}','${cycle}')">🔄 Try Again</button>
    <button class="btn btn-outline" onclick="goToDashboard()">← Back to Dashboard</button>
    <div style="margin-top:20px;font-size:12px;color:#999;">
      If you were charged, please contact <a href="mailto:support@azolve.io" style="color:#00A09D;">support@azolve.io</a> with your Order ID.
    </div>
  `;
}

function goToDashboard() {
  window.location.href = 'app-dashboard.html';
}

function retryPayment(plan, cycle) {
  window.location.href = `app-dashboard.html#subscriptions`;
  setTimeout(() => {
    if (typeof navigate === 'function') navigate('subscriptions');
  }, 500);
}

// Start verification
init();
</script>
</body>
</html>
